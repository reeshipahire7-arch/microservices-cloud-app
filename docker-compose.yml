services:

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5001"
    networks:
      - microservices-network

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5002:5002"
    networks:
      - microservices-network

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5003:5003"
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge